name: Binary Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: binary-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: |
          pnpm --filter @monet/core build
          pnpm typecheck
          pnpm test

      - name: Build the CLI
        run: |
          pnpm --filter @monet/core build
          pnpm --filter @monet/cli build

      - name: Build the standalone binaries
        run: pnpm --filter @monet/cli build:binary

      - name: Smoke test the host binary
        run: |
          # A compiled binary can fail before it prints anything. Run the
          # Linux build on the Linux runner so a broken release never ships.
          timeout 15s ./packages/cli/dist/binaries/monet-linux-x64-glibc-baseline --version
          timeout 15s ./packages/cli/dist/binaries/monet-linux-x64-glibc-baseline --help >/dev/null

      - name: Copy the skill template next to the binaries
        run: |
          # The standalone binary looks for the authored skill template next
          # to its own executable.
          cp -R MonetSkill packages/cli/dist/binaries/

      - name: Publish the release
        uses: wevm/incur/release@v1
        with:
          files: |
            packages/cli/dist/binaries/*
